name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: gitzi-linux-x86_64.tar.gz

          - os: macos-13
            target: x86_64-apple-darwin
            archive: gitzi-macos-x86_64.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            archive: gitzi-macos-aarch64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: gitzi-windows-x86_64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install build deps (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools cmake

      - name: Install build deps (macOS / Windows)
        if: runner.os != 'Linux'
        uses: lukka/get-cmake@latest

      - name: Build
        run: cargo build --release --features dashboard --target ${{ matrix.target }}

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/gitzi gitzi
          tar czf ${{ matrix.archive }} gitzi
          rm gitzi

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target\${{ matrix.target }}\release\gitzi.exe" "gitzi.exe"
          Compress-Archive -Path gitzi.exe -DestinationPath ${{ matrix.archive }}
          Remove-Item gitzi.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gitzi-linux-x86_64.tar.gz
            gitzi-macos-x86_64.tar.gz
            gitzi-macos-aarch64.tar.gz
            gitzi-windows-x86_64.zip
          generate_release_notes: true
