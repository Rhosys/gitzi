name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary: gitzi-linux-x86_64

          - os: macos-13
            target: x86_64-apple-darwin
            binary: gitzi-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            binary: gitzi-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: gitzi-windows-x86_64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install build deps (Linux musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get install -y musl-tools cmake

      - name: Install build deps (macOS / Windows)
        if: runner.os != 'Linux'
        uses: lukka/get-cmake@latest

      - name: Build
        run: cargo build --release --features dashboard --target ${{ matrix.target }}

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: cp target/${{ matrix.target }}/release/gitzi ${{ matrix.binary }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item "target\${{ matrix.target }}\release\gitzi.exe" "${{ matrix.binary }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            gitzi-linux-x86_64
            gitzi-macos-x86_64
            gitzi-macos-aarch64
            gitzi-windows-x86_64.exe
          generate_release_notes: true
